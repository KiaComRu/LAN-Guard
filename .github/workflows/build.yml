name: Build and test
on: [push, pull_request]
jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test LanGuard.slnx --configuration Release
      - run: dotnet run --project src/LanGuard.Agent --configuration Release -- --inventory-only
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/LanGuard.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/LanGuard.Web/package-lock.json
      - run: npm ci
      - run: npm run build
