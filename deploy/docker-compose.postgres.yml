services:
  languard:
    environment:
      LanGuard__Demo: "false"
      ConnectionStrings__Postgres: "Host=db;Database=languard;Username=languard;Password=${LAN_GUARD_DB_PASSWORD:?Set LAN_GUARD_DB_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: languard
      POSTGRES_USER: languard
      POSTGRES_PASSWORD: ${LAN_GUARD_DB_PASSWORD:?Set LAN_GUARD_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "languard", "-d", "languard"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
